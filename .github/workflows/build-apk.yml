name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Add node to PATH for Gradle subprocesses
        run: echo "$(dirname $(which node))" >> $GITHUB_PATH

      - name: Install JS dependencies (ci)
        run: npm ci --legacy-peer-deps

      - name: Verify critical packages installed
        run: |
          echo "Node: $(node --version), path: $(which node)"
          ls node_modules/react-native/package.json         && echo "react-native OK"
          ls node_modules/@react-native/gradle-plugin/package.json && echo "gradle-plugin OK"
          ls node_modules/expo-modules-autolinking/package.json    && echo "expo-modules-autolinking OK"

      - name: Test node resolution from android/ (mirrors settings.gradle)
        run: |
          cd android
          node --print "require.resolve('react-native/package.json')"
          node --print "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
          node --print "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZENIN-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
